<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Movie Catalog</title>
<style>
  /* Sized in vw so it scales from 1280x720 to 1920x1080 TV browsers.
     Deliberately no shadows, blurs or filters: they are slow on TV chips. */
  :root {
    --bg: #0b0b0f;
    --panel: #17171d;
    --text: #f5f5f7;
    --muted: #a0a0ab;
    --accent: #ffc83d;
    --focus: #ffffff;
  }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--text); overflow: hidden; }
  body { font-family: -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif; font-size: 1.15vw; }
  .screen { position: fixed; top: 0; left: 0; right: 0; bottom: 0; display: none; background: var(--bg); }
  .screen.on { display: block; }
  .hide { display: none !important; }

  /* ---------- home ---------- */
  #hero { position: absolute; top: 0; left: 0; right: 0; height: 46vh; overflow: hidden; }
  #hero-img { position: absolute; top: 0; right: 0; width: 68%; height: 100%; object-fit: cover; opacity: 0; transition: opacity .25s linear; }
  #hero-img.on { opacity: 1; }
  #hero .shade { position: absolute; top: 0; bottom: 0; right: 0; width: 70%;
    background: linear-gradient(90deg, var(--bg) 0%, rgba(11,11,15,.75) 25%, rgba(11,11,15,0) 60%),
                linear-gradient(0deg, var(--bg) 0%, rgba(11,11,15,0) 40%); }
  #hero .txt { position: absolute; left: 4vw; top: 5.4vw; width: 46%; }
  #hero h1 { font-size: 2.7vw; line-height: 1.1; margin: 0 0 .7vw; letter-spacing: -.02em; font-weight: 800; }
  .meta { color: var(--muted); font-size: 1.05vw; }
  .meta b { color: var(--accent); font-weight: 700; }
  .pill { display: inline-block; font-size: .78vw; font-weight: 800; letter-spacing: .05em; padding: .15vw .55vw; border-radius: .3vw; background: var(--accent); color: #000; vertical-align: .15vw; margin-right: .5vw; }
  #hero p { font-size: 1.1vw; line-height: 1.45; color: #d4d4da; margin: .8vw 0 0;
    display: -webkit-box; -webkit-line-clamp: 3; -webkit-box-orient: vertical; overflow: hidden; }

  #topbar { position: absolute; top: 1.8vw; left: 4vw; right: 4vw; display: flex; align-items: center; }
  #brand { font-weight: 800; font-size: 1.35vw; letter-spacing: -.01em; margin-right: 2vw; }
  #brand span { color: var(--accent); }
  .tbtn { padding: .4vw 1.1vw; border-radius: 99vw; color: var(--muted); font-weight: 600; border: .18vw solid transparent; margin-right: .6vw; }
  .tbtn.focus { border-color: var(--focus); color: var(--text); }
  #clock { margin-left: auto; color: var(--muted); font-size: 1.2vw; }

  #rows-vp { position: absolute; top: 46vh; left: 0; right: 0; bottom: 0; overflow: hidden; }
  #rows { will-change: transform; transition: transform .2s ease-out; }
  .row { padding: 0 0 1.4vw 4vw; }
  .row h3 { margin: 0 0 .6vw; font-size: 1.2vw; font-weight: 700; color: #e8e8ec; }
  .row.cur h3 { color: var(--text); }
  .track { white-space: nowrap; will-change: transform; transition: transform .2s ease-out; }
  .card { display: inline-block; vertical-align: top; width: 8.6vw; height: 12.9vw; margin-right: .9vw; border-radius: .5vw;
    background: var(--panel); position: relative; overflow: hidden; border: .22vw solid transparent; }
  .card img { width: 100%; height: 100%; object-fit: cover; display: block; }
  .card.has-img .ph { display: none; }
  .card .ph { position: absolute; left: .5vw; right: .5vw; bottom: .5vw; font-size: .85vw; font-weight: 600; white-space: normal; color: var(--muted); }
  .card .badge { position: absolute; top: .4vw; left: .4vw; font-size: .65vw; font-weight: 800; padding: .1vw .4vw; border-radius: .25vw; background: var(--accent); color: #000; }
  .card.focus { border-color: var(--focus); }

  #status { position: absolute; top: 50vh; left: 0; right: 0; text-align: center; color: var(--muted); font-size: 1.4vw; }

  /* ---------- details ---------- */
  #details .bg { position: absolute; top: 0; right: 0; width: 72%; height: 100%; object-fit: cover; }
  #details .shade { position: absolute; top: 0; bottom: 0; right: 0; width: 74%;
    background: linear-gradient(90deg, var(--bg) 0%, rgba(11,11,15,.88) 30%, rgba(11,11,15,.35) 75%, rgba(11,11,15,.2) 100%); }
  #details .body { position: absolute; left: 4vw; top: 4vw; width: 50%; bottom: 3vw; }
  #details h1 { font-size: 3vw; line-height: 1.08; margin: 0 0 .8vw; letter-spacing: -.02em; }
  #d-tag { color: var(--accent); font-style: italic; margin: .6vw 0 0; font-size: 1.1vw; }
  #d-over { font-size: 1.2vw; line-height: 1.5; color: #dcdce2; margin: 1vw 0; max-height: 9.2vw; overflow: hidden; }
  .credits { font-size: 1vw; color: var(--muted); line-height: 1.6; }
  .credits span { color: #d8d8de; }
  .btns { margin: 1.6vw 0 1.4vw; white-space: nowrap; }
  .btn { display: inline-block; padding: .85vw 1.7vw; margin-right: .8vw; border-radius: 99vw; background: #2a2a33; font-weight: 700; font-size: 1.15vw; border: .22vw solid transparent; }
  .btn.primary { background: var(--accent); color: #000; }
  .btn.focus { border-color: var(--focus); }
  #d-where h4 { margin: 0 0 .6vw; font-size: 1vw; color: var(--muted); font-weight: 600; text-transform: uppercase; letter-spacing: .06em; }
  .prov { display: inline-block; margin: 0 .9vw .6vw 0; font-size: .95vw; color: #d8d8de; vertical-align: middle; }
  .prov img { width: 2.4vw; height: 2.4vw; border-radius: .45vw; vertical-align: middle; margin-right: .45vw; background: #222; }
  .prov .k { color: var(--muted); margin-right: .4vw; }
  #d-attr { position: absolute; left: 4vw; bottom: 1.4vw; font-size: .75vw; color: #6f6f7a; }

  /* ---------- search ---------- */
  #search { padding: 3vw 4vw; }
  #q { width: 60%; font-size: 1.6vw; padding: .8vw 1.2vw; border-radius: .6vw; border: .22vw solid #333; background: var(--panel); color: var(--text); outline: none; }
  #q.focus { border-color: var(--focus); }
  #s-hint { color: var(--muted); margin: .8vw 0 1.6vw; }
  #s-grid { white-space: normal; }
  #s-grid .card { margin: 0 .9vw 1.2vw 0; }

  /* ---------- players ---------- */
  #player, #yts { background: #000; }
  #video { width: 100%; height: 100%; background: #000; }
  #ytbox, #ytbox iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: 0; }
  .ov { position: absolute; left: 0; right: 0; bottom: 0; padding: 3vw 4vw 2.4vw;
    background: linear-gradient(0deg, rgba(0,0,0,.85), rgba(0,0,0,0)); transition: opacity .2s linear; }
  .ov.off { opacity: 0; }
  .ov .ttl { font-size: 1.7vw; font-weight: 700; margin-bottom: 1vw; }
  .bar { height: .45vw; background: rgba(255,255,255,.25); border-radius: 99vw; overflow: hidden; }
  .bar div { height: 100%; width: 0; background: var(--accent); }
  .ov .row2 { display: flex; justify-content: space-between; margin-top: .7vw; color: #ddd; font-size: 1vw; }
  .center-msg { position: absolute; top: 45%; left: 0; right: 0; text-align: center; font-size: 1.5vw; color: #ddd; }
  .keys { color: #bbb; font-size: .95vw; }
  .key { display: inline-block; padding: .05vw .45vw; border: .1vw solid #555; border-radius: .3vw; color: #fff; margin: 0 .3vw 0 .9vw; }

  /* ---------- QR ---------- */
  #qrs { background: rgba(5,5,8,.96); text-align: center; }
  #qrs h2 { margin: 7vh 0 .6vw; font-size: 2vw; }
  #qrs .sub { color: var(--muted); margin-bottom: 2vw; }
  #qr { display: inline-block; padding: 1.2vw; background: #fff; border-radius: 1vw; }
  #qr img, #qr canvas { display: block; width: 18vw !important; height: 18vw !important; }
  #qr-url { color: var(--muted); margin-top: 1.4vw; font-size: .95vw; }

  #toast { position: fixed; left: 50%; bottom: 3vw; transform: translateX(-50%); background: #26262e; padding: .8vw 1.6vw; border-radius: 99vw; font-size: 1.05vw; opacity: 0; transition: opacity .2s linear; }
  #toast.on { opacity: 1; }
</style>
</head>
<body>

<div id="home" class="screen on">
  <div id="hero">
    <img id="hero-img" alt="">
    <div class="shade"></div>
    <div class="txt">
      <h1 id="h-title"></h1>
      <div class="meta" id="h-meta"></div>
      <p id="h-over"></p>
    </div>
  </div>
  <div id="topbar">
    <div id="brand">Movie<span>.</span>Catalog</div>
    <div class="tbtn" id="tb-search">Search</div>
    <div id="clock"></div>
  </div>
  <div id="rows-vp"><div id="rows"></div></div>
  <div id="status">Loading…</div>
</div>

<div id="details" class="screen">
  <img class="bg" id="d-bg" alt="">
  <div class="shade"></div>
  <div class="body">
    <h1 id="d-title"></h1>
    <div class="meta" id="d-meta"></div>
    <div id="d-tag"></div>
    <div id="d-over"></div>
    <div class="credits" id="d-credits"></div>
    <div class="btns" id="d-btns"></div>
    <div id="d-where"></div>
  </div>
  <div id="d-attr"></div>
</div>

<div id="search" class="screen">
  <input id="q" type="text" placeholder="Search titles" autocomplete="off">
  <div id="s-hint">Type with the on-screen keyboard · ▼ to results · BACK to close</div>
  <div id="s-grid"></div>
</div>

<div id="player" class="screen">
  <video id="video" preload="auto"></video>
  <div class="center-msg hide" id="v-msg"></div>
  <div class="ov" id="v-ov">
    <div class="ttl" id="v-title"></div>
    <div class="bar"><div id="v-bar"></div></div>
    <div class="row2"><span id="v-time">0:00 / 0:00</span>
      <span class="keys"><span class="key">OK</span>play/pause<span class="key">◀ ▶</span>seek<span class="key">BACK</span>close</span></div>
  </div>
</div>

<div id="yts" class="screen">
  <div id="ytbox"></div>
  <div class="center-msg hide" id="yt-msg"></div>
  <div class="ov" id="yt-ov">
    <div class="ttl" id="yt-title"></div>
    <div class="keys"><span class="key">OK</span>pause<span class="key">◀ ▶</span>10s<span class="key">▼</span>watch on phone<span class="key">BACK</span>close</div>
  </div>
</div>

<div id="qrs" class="screen">
  <h2 id="qr-title">Scan to watch on your phone</h2>
  <div class="sub" id="qr-sub"></div>
  <div id="qr"></div>
  <div id="qr-url"></div>
  <div class="keys" style="margin-top:2vw"><span class="key">BACK</span>close</div>
</div>

<div id="toast"></div>

<script>
/* ES5 only: VIDAA browser engines vary by model and age. */
(function () {
  var K = { LEFT: 37, UP: 38, RIGHT: 39, DOWN: 40, OK: 13,
            PLAY: 415, PAUSE: 19, PLAYPAUSE: 10252, STOP: 413, REW: 412, FF: 417 };
  // Back is 8 on Hisense/VIDAA; 27/461/10009 cover desktop and other TV browsers.
  var BACK = { 8: 1, 27: 1, 461: 1, 10009: 1 };
  var QR_LIB = 'https://cdnjs.cloudflare.com/ajax/libs/qrcodejs/1.0.0/qrcode.min.js';

  var $ = function (id) { return document.getElementById(id); };
  function el(tag, cls, text) {
    var e = document.createElement(tag);
    if (cls) e.className = cls;
    if (text != null) e.textContent = text;
    return e;
  }
  function getJSON(url, ok, fail) {
    var x = new XMLHttpRequest();
    x.open('GET', url);
    x.timeout = 15000;
    x.onload = function () {
      if (x.status !== 200) return fail && fail('HTTP ' + x.status);
      try { ok(JSON.parse(x.responseText)); } catch (e) { fail && fail(e.message); }
    };
    x.onerror = x.ontimeout = function () { fail && fail('network'); };
    x.send();
  }
  var toastT;
  function toast(msg) {
    var t = $('toast'); t.textContent = msg; t.className = 'on';
    clearTimeout(toastT); toastT = setTimeout(function () { t.className = ''; }, 2600);
  }
  function fmtTime(s) {
    s = Math.max(0, Math.floor(s || 0));
    var h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), sec = s % 60;
    return (h ? h + ':' + (m < 10 ? '0' : '') : '') + m + ':' + (sec < 10 ? '0' : '') + sec;
  }
  function metaLine(it, d) {
    var parts = [];
    if (d && d.rt) parts.push(Math.floor(d.rt / 60) ? Math.floor(d.rt / 60) + 'h ' + (d.rt % 60) + 'm' : d.rt + 'm');
    if (it.y) parts.unshift(it.y);
    if (d && d.g && d.g.length) parts.push(d.g.join(', '));
    return parts.join('  ·  ');
  }
  function show(id) {
    var ids = ['home', 'details', 'search', 'player', 'yts', 'qrs'];
    for (var i = 0; i < ids.length; i++) $(ids[i]).className = 'screen' + (ids[i] === id ? ' on' : '');
    screen = id;
  }

  /* ================= state ================= */
  var screen = 'home';
  var rows = [], cardEls = [], rowEls = [];
  var allItems = {};            // id -> card item (for search and lookups)
  var detailCache = {};
  var focusRow = 0, rowCol = [], homeZone = 'rows';
  var current = null;           // card item shown in details
  var detBtns = [], detFocus = 0;
  var backTo = 'home';          // where BACK from the QR screen returns

  /* ================= home ================= */
  function buildHome(data) {
    rows = (data.rows || []).filter(function (r) { return r.items && r.items.length; });
    var box = $('rows');
    box.innerHTML = '';
    rowEls = []; cardEls = []; rowCol = [];
    for (var r = 0; r < rows.length; r++) {
      var rowEl = el('div', 'row');
      rowEl.appendChild(el('h3', null, rows[r].title));
      var track = el('div', 'track');
      var cards = [];
      for (var c = 0; c < rows[r].items.length; c++) {
        var it = rows[r].items[c];
        allItems[it.id] = it;
        var card = el('div', 'card');
        card.appendChild(el('div', 'ph', it.t));
        if (rows[r].pd) card.appendChild(el('div', 'badge', 'FULL MOVIE'));
        card._it = it;
        track.appendChild(card);
        cards.push(card);
      }
      rowEl.appendChild(track);
      rowEl._track = track;
      box.appendChild(rowEl);
      rowEls.push(rowEl); cardEls.push(cards); rowCol.push(0);
    }
    $('status').className = 'hide';
    focusRow = 0;
    loadImagesNear(0);
    updateHomeFocus();
  }

  // Only rows near the focused one get their posters loaded.
  function loadImagesNear(r) {
    for (var i = Math.max(0, r - 1); i <= Math.min(rows.length - 1, r + 2); i++) {
      var cards = cardEls[i];
      if (cards._loaded) continue;
      cards._loaded = true;
      for (var c = 0; c < cards.length; c++) {
        if (!cards[c]._it.p) continue;
        var img = new Image();
        img.alt = '';
        img.onload = (function (card, im) { return function () { card.insertBefore(im, card.firstChild); card.className += ' has-img'; }; })(cards[c], img);
        img.src = cards[c]._it.p;
      }
    }
  }

  var prevCard = null, heroT, prefetchT;
  function updateHomeFocus() {
    $('tb-search').className = 'tbtn' + (homeZone === 'top' ? ' focus' : '');
    if (prevCard) prevCard.className = prevCard.className.replace(' focus', '');
    prevCard = null;
    for (var i = 0; i < rowEls.length; i++) rowEls[i].className = 'row' + (i === focusRow ? ' cur' : '');
    if (!rows.length) return;

    var col = rowCol[focusRow];
    var card = cardEls[focusRow][col];
    if (homeZone === 'rows') { card.className += ' focus'; prevCard = card; }

    // Horizontal: keep the focused card second from the left.
    var first = Math.max(0, col - 1);
    rowEls[focusRow]._track.style.transform = 'translateX(' + (-cardEls[focusRow][first].offsetLeft) + 'px)';
    // Vertical: focused row at the top of the rows area.
    $('rows').style.transform = 'translateY(' + (-rowEls[focusRow].offsetTop) + 'px)';

    updateHero(card._it, rows[focusRow].pd);
    clearTimeout(prefetchT);
    prefetchT = setTimeout(function () { fetchDetail(card._it.id); }, 350);
  }

  function updateHero(it, pd) {
    $('h-title').textContent = it.t;
    var meta = $('h-meta');
    meta.innerHTML = '';
    if (pd) meta.appendChild(el('span', 'pill', 'FREE · FULL MOVIE'));
    if (it.r) { meta.appendChild(el('b', null, '★ ' + it.r)); meta.appendChild(document.createTextNode('   ')); }
    meta.appendChild(document.createTextNode(it.y || ''));
    $('h-over').textContent = it.o || '';
    // Swap the backdrop only after the focus settles, so fast scrolling stays smooth.
    clearTimeout(heroT);
    var hero = $('hero-img');
    hero.className = '';
    if (!it.b) return;
    heroT = setTimeout(function () {
      var img = new Image();
      img.onload = function () { if (rows.length && currentHomeItem() === it) { hero.src = it.b; hero.className = 'on'; } };
      img.src = it.b;
    }, 260);
  }
  function currentHomeItem() { return cardEls[focusRow][rowCol[focusRow]]._it; }

  function homeKey(k) {
    if (homeZone === 'top') {
      if (k === K.DOWN) { homeZone = 'rows'; updateHomeFocus(); }
      else if (k === K.OK) openSearch();
      return true;
    }
    var col = rowCol[focusRow], n = cardEls[focusRow].length;
    if (k === K.LEFT) { if (col > 0) rowCol[focusRow] = col - 1; else return true; }
    else if (k === K.RIGHT) { if (col < n - 1) rowCol[focusRow] = col + 1; else return true; }
    else if (k === K.UP) { if (focusRow > 0) focusRow--; else homeZone = 'top'; }
    else if (k === K.DOWN) { if (focusRow < rows.length - 1) focusRow++; else return true; }
    else if (k === K.OK) { openDetails(currentHomeItem(), 'home'); return true; }
    else return false;
    loadImagesNear(focusRow);
    updateHomeFocus();
    return true;
  }

  /* ================= details ================= */
  var detailsFrom = 'home';
  function fetchDetail(id, cb) {
    if (detailCache[id]) { if (cb) cb(detailCache[id]); return; }
    getJSON('data/m/' + id + '.json', function (d) { detailCache[id] = d; if (cb) cb(d); },
            function () { if (cb) cb(null); });
  }

  function openDetails(it, from) {
    current = it;
    detailsFrom = from;
    fetchDetail(it.id, function (d) {
      if (current !== it) return;
      if (!d) return toast('Couldn’t load details. Try again.');
      renderDetails(it, d);
      show('details');
    });
  }

  function renderDetails(it, d) {
    var bg = $('d-bg');
    bg.removeAttribute('src');
    if (d.b || it.b) bg.src = d.b || it.b; else if (d.p) bg.src = d.p;
    $('d-title').textContent = d.t || it.t;
    var meta = $('d-meta');
    meta.innerHTML = '';
    if (d.video) meta.appendChild(el('span', 'pill', 'FREE · FULL MOVIE'));
    if (d.r) { meta.appendChild(el('b', null, '★ ' + d.r)); meta.appendChild(document.createTextNode('   ')); }
    meta.appendChild(document.createTextNode(metaLine(it, d)));
    $('d-tag').textContent = d.tag && d.tag !== 'Public domain' ? d.tag : '';
    $('d-over').textContent = d.o || it.o || '';

    var cr = $('d-credits');
    cr.innerHTML = '';
    if (d.dir && d.dir.length) { cr.appendChild(document.createTextNode('Director  ')); cr.appendChild(el('span', null, d.dir.join(', '))); cr.appendChild(el('br')); }
    if (d.cast && d.cast.length) { cr.appendChild(document.createTextNode('Starring  ')); cr.appendChild(el('span', null, d.cast.join(', '))); }

    // Buttons
    detBtns = [];
    var bx = $('d-btns');
    bx.innerHTML = '';
    function addBtn(label, primary, fn) {
      var b = el('div', 'btn' + (primary ? ' primary' : ''), label);
      b._fn = fn; bx.appendChild(b); detBtns.push(b);
    }
    if (d.video) addBtn('▶  Play film', true, function () { playFilm(d); });
    if (d.yt) addBtn('▶  Trailer', !d.video, function () { playTrailer(d); });
    if (d.yt) addBtn('Trailer on phone', false, function () { showQR('https://www.youtube.com/watch?v=' + d.yt, 'Scan to watch the trailer', d.t, 'details'); });
    if (d.video && d.src) addBtn('Watch on phone', false, function () { showQR(d.src, 'Scan to watch on your phone', d.t, 'details'); });
    if (!d.video && !d.yt && d.info) addBtn('More info on phone', true, function () { showQR(d.info, 'Scan for more info', d.t, 'details'); });
    detFocus = 0;
    paintDetBtns();

    // Where to watch (TMDB / JustWatch, Nigeria)
    var w = $('d-where');
    w.innerHTML = '';
    var p = d.prov || {};
    var groups = [['Stream', p.stream], ['Free', p.free], ['Rent', p.rent], ['Buy', p.buy]];
    var any = false;
    for (var g = 0; g < groups.length; g++) {
      var list = groups[g][1] || [];
      if (!list.length) continue;
      if (!any) { w.appendChild(el('h4', null, 'Where to watch in Nigeria')); any = true; }
      var line = el('div');
      line.appendChild(el('span', 'prov k', groups[g][0]));
      for (var i = 0; i < Math.min(list.length, 4); i++) {
        var pv = el('span', 'prov');
        if (list[i].l) { var im = new Image(); im.src = list[i].l; im.alt = ''; pv.appendChild(im); }
        pv.appendChild(document.createTextNode(list[i].n));
        line.appendChild(pv);
      }
      w.appendChild(line);
    }
    if (d.video) {
      w.appendChild(el('h4', null, 'Public domain'));
      w.appendChild(el('div', 'prov', 'Free to watch · from the Internet Archive'));
    }
    $('d-attr').textContent = d.video
      ? 'Film: Internet Archive (public domain)' + (d.yt || d.cast.length ? ' · Info: TMDB (not endorsed or certified by TMDB)' : '')
      : 'Catalog & trailers: TMDB (this product uses the TMDB API but is not endorsed or certified by TMDB) · Where to watch: JustWatch';
  }

  function paintDetBtns() {
    for (var i = 0; i < detBtns.length; i++) {
      detBtns[i].className = detBtns[i].className.replace(' focus', '') + (i === detFocus ? ' focus' : '');
    }
  }

  function detailsKey(k) {
    if (k === K.LEFT && detFocus > 0) detFocus--;
    else if (k === K.RIGHT && detFocus < detBtns.length - 1) detFocus++;
    else if (k === K.OK && detBtns[detFocus]) detBtns[detFocus]._fn();
    else return k === K.UP || k === K.DOWN;
    paintDetBtns();
    return true;
  }

  /* ================= search ================= */
  var sResults = [], sZone = 'input', sFocus = 0, S_COLS = 9;
  function norm(s) { return (s || '').toLowerCase().replace(/[^a-z0-9]/g, ''); }
  function openSearch() {
    show('search');
    sZone = 'input';
    paintSearch();
    var q = $('q');
    setTimeout(function () { q.focus(); }, 50);   // brings up the TV keyboard
    runSearch();
  }
  function runSearch() {
    var q = norm($('q').value);
    sResults = [];
    for (var id in allItems) {
      if (!allItems.hasOwnProperty(id)) continue;
      if (!q || norm(allItems[id].t).indexOf(q) !== -1) sResults.push(allItems[id]);
    }
    if (!q) sResults = sResults.slice(0, S_COLS * 2);
    var grid = $('s-grid');
    grid.innerHTML = '';
    for (var i = 0; i < Math.min(sResults.length, S_COLS * 3); i++) {
      var c = el('div', 'card');
      c.appendChild(el('div', 'ph', sResults[i].t));
      if (sResults[i].p) { var im = new Image(); im.alt = ''; im.onload = (function (cc, ii) { return function () { cc.insertBefore(ii, cc.firstChild); cc.className += ' has-img'; }; })(c, im); im.src = sResults[i].p; }
      grid.appendChild(c);
    }
    $('s-hint').textContent = q ? sResults.length + ' result' + (sResults.length === 1 ? '' : 's') + ' · ▼ to results · BACK to close'
                                : 'Type with the on-screen keyboard · ▼ to results · BACK to close';
    sFocus = 0;
    paintSearch();
  }
  function paintSearch() {
    $('q').className = sZone === 'input' ? 'focus' : '';
    var cards = $('s-grid').children;
    for (var i = 0; i < cards.length; i++) cards[i].className = cards[i].className.replace(' focus', '') + (sZone === 'grid' && i === sFocus ? ' focus' : '');
  }
  function searchKey(k, e) {
    var n = $('s-grid').children.length;
    if (sZone === 'input') {
      if ((k === K.DOWN || k === K.OK) && n) { sZone = 'grid'; $('q').blur(); paintSearch(); return true; }
      return false;   // let the input handle typing / cursor keys
    }
    if (k === K.LEFT) { if (sFocus % S_COLS > 0) sFocus--; }
    else if (k === K.RIGHT) { if (sFocus % S_COLS < S_COLS - 1 && sFocus + 1 < n) sFocus++; }
    else if (k === K.UP) { if (sFocus - S_COLS >= 0) sFocus -= S_COLS; else { sZone = 'input'; $('q').focus(); } }
    else if (k === K.DOWN) { if (sFocus + S_COLS < n) sFocus += S_COLS; }
    else if (k === K.OK) { openDetails(sResults[sFocus], 'search'); return true; }
    else return false;
    paintSearch();
    return true;
  }
  $('q').addEventListener('input', runSearch, false);

  /* ================= native player (public-domain films) ================= */
  var video = $('video'), ovT, seekStep = 10, lastSeek = 0;
  function playFilm(d) {
    show('player');
    $('v-title').textContent = d.t;
    $('v-msg').textContent = 'Loading…';
    $('v-msg').className = 'center-msg';
    video.src = d.video;
    var p = video.play();
    if (p && p['catch']) p['catch'](function () { $('v-msg').textContent = 'Press OK to play'; });
    pokeOverlay();
  }
  function closeFilm() {
    video.pause();
    video.removeAttribute('src');
    video.load();   // releases the TV's hardware decoder
    show('details');
  }
  function pokeOverlay() {
    $('v-ov').className = 'ov';
    clearTimeout(ovT);
    ovT = setTimeout(function () { if (!video.paused) $('v-ov').className = 'ov off'; }, 3500);
    paintProgress();
  }
  function paintProgress() {
    var dur = video.duration || 0, t = video.currentTime || 0;
    $('v-bar').style.width = dur ? (100 * t / dur) + '%' : '0';
    $('v-time').textContent = fmtTime(t) + ' / ' + fmtTime(dur);
  }
  video.addEventListener('timeupdate', function () { if ($('v-ov').className === 'ov') paintProgress(); }, false);
  video.addEventListener('playing', function () { $('v-msg').className = 'center-msg hide'; pokeOverlay(); }, false);
  video.addEventListener('waiting', function () { $('v-msg').textContent = 'Loading…'; $('v-msg').className = 'center-msg'; }, false);
  video.addEventListener('pause', function () { pokeOverlay(); $('v-ov').className = 'ov'; clearTimeout(ovT); }, false);
  video.addEventListener('error', function () {
    if (screen !== 'player') return;
    $('v-msg').textContent = 'This film can’t play right now. Press BACK and try “Watch on phone”.';
    $('v-msg').className = 'center-msg';
  }, false);

  function playerKey(k) {
    if (k === K.OK || k === K.PLAYPAUSE) { if (video.paused) video.play(); else video.pause(); }
    else if (k === K.PLAY) video.play();
    else if (k === K.PAUSE) video.pause();
    else if (k === K.STOP) { closeFilm(); return true; }
    else if (k === K.LEFT || k === K.RIGHT || k === K.REW || k === K.FF) {
      // Holding the key speeds up seeking: 10s → 30s → 60s.
      var now = Date.now();
      seekStep = now - lastSeek < 400 ? Math.min(60, seekStep < 30 ? 30 : 60) : 10;
      lastSeek = now;
      var dir = (k === K.LEFT || k === K.REW) ? -1 : 1;
      if (video.duration) video.currentTime = Math.max(0, Math.min(video.duration - 1, video.currentTime + dir * seekStep));
    }
    else if (k !== K.UP && k !== K.DOWN) return false;
    pokeOverlay();
    return true;
  }

  /* ================= YouTube trailers ================= */
  var yt = null, ytApiState = 0, ytQueue = null, ytOvT, ytSlowT, ytCurrent = null;
  function loadYTApi(cb) {
    if (ytApiState === 2) return cb();
    ytQueue = cb;
    if (ytApiState === 1) return;
    ytApiState = 1;
    window.onYouTubeIframeAPIReady = function () { ytApiState = 2; if (ytQueue) { var f = ytQueue; ytQueue = null; f(); } };
    var s = document.createElement('script');
    s.src = 'https://www.youtube.com/iframe_api';
    s.onerror = function () { ytApiState = 0; trailerFailed('Couldn’t reach YouTube.'); };
    document.body.appendChild(s);
  }
  function playTrailer(d) {
    ytCurrent = d;
    show('yts');
    $('yt-title').textContent = d.t + ' · Trailer';
    ytMsg('Loading trailer…');
    pokeYTOverlay();
    clearTimeout(ytSlowT);
    ytSlowT = setTimeout(function () { ytMsg('Taking a while… press ▼ to watch on your phone'); }, 9000);
    loadYTApi(function () {
      if (screen !== 'yts' || ytCurrent !== d) return;
      $('ytbox').innerHTML = '<div id="ytp"></div>';
      yt = new YT.Player('ytp', {
        videoId: d.yt, width: '100%', height: '100%',
        playerVars: { autoplay: 1, controls: 0, disablekb: 1, rel: 0, playsinline: 1, fs: 0,
                      iv_load_policy: 3, modestbranding: 1, cc_load_policy: 0, origin: location.protocol + '//' + location.host },
        events: {
          onReady: function (e) { e.target.playVideo(); window.focus(); },
          onStateChange: function (e) {
            if (e.data === 1) { clearTimeout(ytSlowT); ytMsg(''); pokeYTOverlay(); }
            if (e.data === 0) closeTrailer();
          },
          onError: function () { trailerFailed('This trailer can’t play on the TV.'); }
        }
      });
    });
  }
  function ytMsg(t) { $('yt-msg').textContent = t; $('yt-msg').className = 'center-msg' + (t ? '' : ' hide'); }
  function trailerFailed(msg) {
    if (screen !== 'yts' || !ytCurrent) return;
    var d = ytCurrent;
    closeTrailer();
    showQR('https://www.youtube.com/watch?v=' + d.yt, msg + ' Scan to watch on your phone', d.t, 'details');
  }
  function closeTrailer() {
    clearTimeout(ytSlowT);
    try { if (yt) yt.destroy(); } catch (e) {}
    yt = null;
    $('ytbox').innerHTML = '';
    if (screen === 'yts') show('details');
  }
  function pokeYTOverlay() {
    $('yt-ov').className = 'ov';
    clearTimeout(ytOvT);
    ytOvT = setTimeout(function () { $('yt-ov').className = 'ov off'; }, 3500);
  }
  function ytKey(k) {
    if (k === K.DOWN) { var d = ytCurrent; closeTrailer(); showQR('https://www.youtube.com/watch?v=' + d.yt, 'Scan to watch the trailer', d.t, 'details'); return true; }
    if (!yt || !yt.getPlayerState) { pokeYTOverlay(); return true; }
    if (k === K.OK || k === K.PLAYPAUSE) { if (yt.getPlayerState() === 1) yt.pauseVideo(); else yt.playVideo(); }
    else if (k === K.PLAY) yt.playVideo();
    else if (k === K.PAUSE) yt.pauseVideo();
    else if (k === K.STOP) { closeTrailer(); return true; }
    else if (k === K.LEFT || k === K.REW) yt.seekTo(Math.max(0, yt.getCurrentTime() - 10), true);
    else if (k === K.RIGHT || k === K.FF) yt.seekTo(yt.getCurrentTime() + 10, true);
    else if (k !== K.UP) return false;
    pokeYTOverlay();
    return true;
  }

  /* ================= QR ================= */
  var qrLib = 0, qrPending = null;
  function showQR(url, title, sub, from) {
    backTo = from || 'home';
    $('qr-title').textContent = title;
    $('qr-sub').textContent = sub || '';
    $('qr-url').textContent = url.replace(/^https?:\/\//, '');
    $('qr').innerHTML = '';
    show('qrs');
    var draw = function () { new QRCode($('qr'), { text: url, width: 360, height: 360, correctLevel: QRCode.CorrectLevel.L }); };
    if (qrLib === 2) return draw();
    qrPending = draw;
    if (qrLib === 1) return;
    qrLib = 1;
    var s = document.createElement('script');
    s.src = QR_LIB;
    s.onload = function () { qrLib = 2; if (qrPending) qrPending(); };
    s.onerror = function () { qrLib = 0; $('qr').textContent = 'Couldn’t load the QR code. Open: ' + url; };
    document.body.appendChild(s);
  }

  /* ================= input ================= */
  document.addEventListener('keydown', function (e) {
    var k = e.keyCode;
    var inInput = document.activeElement === $('q');

    if (BACK[k]) {
      if (inInput && k === 8 && $('q').value) return;   // Backspace deletes while typing
      e.preventDefault();
      if (screen === 'player') closeFilm();
      else if (screen === 'yts') closeTrailer();
      else if (screen === 'qrs') show(backTo);
      else if (screen === 'details') { show(detailsFrom); if (detailsFrom === 'home') updateHomeFocus(); }
      else if (screen === 'search') { $('q').blur(); show('home'); }
      else if (homeZone === 'top') { homeZone = 'rows'; updateHomeFocus(); }
      else window.close();   // VIDAA apps close themselves on BACK from the main screen
      return;
    }

    var handled = false;
    if (screen === 'home') handled = homeKey(k);
    else if (screen === 'details') handled = detailsKey(k);
    else if (screen === 'search') handled = searchKey(k, e);
    else if (screen === 'player') handled = playerKey(k);
    else if (screen === 'yts') handled = ytKey(k);
    if (handled) e.preventDefault();
  }, false);

  function tickClock() {
    var d = new Date(), h = d.getHours(), m = d.getMinutes();
    $('clock').textContent = (h % 12 || 12) + ':' + (m < 10 ? '0' : '') + m + (h < 12 ? ' AM' : ' PM');
  }
  tickClock();
  setInterval(tickClock, 15000);
  window.addEventListener('resize', function () { if (screen === 'home') updateHomeFocus(); }, false);

  getJSON('data/home.json?t=' + Math.floor(Date.now() / 3600000), buildHome, function (err) {
    $('status').textContent = 'Couldn’t load the catalog (' + err + '). Check the internet connection and reopen the app.';
  });
})();
</script>
</body>
