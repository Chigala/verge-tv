name: Update movie catalog

on:
  schedule:
    - cron: "15 4 * * *"   # daily
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: update-movies
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Build catalog
        env:
          TMDB_TOKEN: ${{ secrets.TMDB_TOKEN }}
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_SEARCH_KEY: ${{ vars.TMDB_SEARCH_KEY }}
          TRAILER_URL_TEMPLATE: ${{ vars.TRAILER_URL_TEMPLATE }}
        run: python3 movies/build_catalog.py
      - name: Commit if changed
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A docs/data
          git diff --cached --quiet || git commit -m "Update movie catalog"
          git pull --rebase
          git push
